 NGC_GATHERING_STORM_DESC:0 "Following its war against Albata and Natanielia, Germany was forced to sign a humiliating peace treaty in Hamburg, ceding vast territories and demilitarizing key regions. As the nation struggled to accept these harsh terms, a radical Militarist Group seized on the chaos, winning control of the Bundestag and taking over the state. However, this nationalist takeover came at a steep cost. Fueled by outrage, a massive wave of the population turned toward socialism, regularly rallying in the streets to resist the Chancellor’s rule. Yet, even amidst internal strife, the state keeps its eyes on the horizon—determined to reclaim its lost lands as the treaty's expiration date draws near."
 BRI_GATHERING_STORM_DESC:0 "The Republic of Brittany stands at a fragile crossroads after gaining full independence following the sudden collapse of Detektivia, transitioning from a long-governed autonomous region into a new democratic government. However, the euphoria of freedom has quickly faded into severe internal turmoil as the nation's political stability is dangerously low, paralyzed by fierce rivalries between deeply divided political parties that threaten to tear the young democracy apart from within."