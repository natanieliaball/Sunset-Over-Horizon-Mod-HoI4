 news_nori.1.t:0 "Death of Meristra Sptatarn"
 news_nori.1.d:0 "In the night of the 14th of February 1936, Meristra Sptatarn, the man who led the Sptatarnian Pact, passed away in his office. Prenitio Sniatar, the Second-in-Command, took charge of the country to ensure its stability. However, following his death, many independence movements began to remerge, notably in Lorraine and Bohemia. Meanwhile, the communists who had long been hunted down by the Pact started to resurface, carrying out acts of resistance in the Alps and in Istria."
 news_nori.1.a:0 "We can finally breathe"